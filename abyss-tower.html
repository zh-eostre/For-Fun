<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深渊之塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8DFCF;--surface:#F6F0E3;--ink:#2B2320;--muted:#6E6056;--line:#CDBFA9;
  --accent:#8E2F25;--gold:#A87A22;--hp:#C0392B;--blk:#2F6E8C;--energy:#E8A33A;--poison:#4F8A2E;
  --arena:#1E2A24;--arena2:#2C3B33;
  --parch:#F3E8D2;--parch-ink:#2A211B;--t-atk:#B33A2B;--t-skl:#2F6E8C;--t-pow:#A87A22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141016;--surface:#1F1A22;--ink:#EDE5DA;--muted:#A3958A;--line:#3A303B;
    --accent:#D0624F;--gold:#E0B252;--hp:#E0533F;--blk:#5AA7CF;--poison:#7CC24E;
    --arena:#0F1612;--arena2:#1B2620;
  }
}
:root[data-theme="dark"]{
  --bg:#141016;--surface:#1F1A22;--ink:#EDE5DA;--muted:#A3958A;--line:#3A303B;
  --accent:#D0624F;--gold:#E0B252;--hp:#E0533F;--blk:#5AA7CF;--poison:#7CC24E;
  --arena:#0F1612;--arena2:#1B2620;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;font-size:15px}
button{font:inherit;color:inherit}
.disp{font-family:"ZCOOL XiaoWei","Noto Serif SC","Songti SC",serif}
.cz{font-family:"Cinzel",Georgia,serif;font-weight:700}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--energy);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:transparent;padding:9px 16px;border-radius:8px;cursor:pointer;line-height:1.3}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:13px}

/* top bar */
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.stat{display:flex;align-items:center;gap:5px;font-size:15px}
.stat b{font-family:"Cinzel",serif;font-size:16px}
.relics{display:flex;gap:4px;flex-wrap:wrap}
.relic{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:32px;height:32px;font-size:17px;cursor:pointer;display:grid;place-items:center;padding:0}
.bar .grow{flex:1}

/* title */
.title{min-height:90vh;display:grid;place-items:center;text-align:center;padding:24px}
.title h1{font-size:clamp(56px,14vw,120px);line-height:1;margin:0;color:var(--accent);letter-spacing:.06em}
.title .sub{font-size:17px;margin:12px 0 28px}
.title .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tower{font-size:64px;line-height:1;margin-bottom:12px}

/* map */
.mapgrid{display:flex;flex-direction:column-reverse;gap:10px;max-width:560px;margin:8px auto}
.floor{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:10px}
.floor .fl{font-family:"Cinzel",serif;color:var(--muted);text-align:right;font-size:14px}
.nodes{display:flex;gap:10px;flex-wrap:wrap}
.node{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;min-width:96px;cursor:default;opacity:.55}
.node .ni{font-size:22px}
.floor.now .node{opacity:1;cursor:pointer;border-color:var(--ink)}
.floor.now .node:hover{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:var(--accent)}
.floor.done .node{opacity:.3}
.floor.done .node.took{opacity:1;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.floor.now{padding:10px 0;border-top:2px dashed var(--accent);border-bottom:2px dashed var(--accent)}

/* arena */
.arena{background:radial-gradient(ellipse at 50% 30%,var(--arena2),var(--arena) 70%);color:#EDE5DA;min-height:calc(100vh - 54px);max-height:none;display:flex;flex-direction:column}
.foes{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 12px 8px;flex:1;min-height:260px}
.enemy{position:relative;background:none;border:0;padding:6px 6px 8px;border-radius:14px;cursor:pointer;width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#EDE5DA}
.enemy.tgt{background:rgba(255,255,255,.06);box-shadow:0 0 0 2px var(--energy)}
.intent{font-size:15px;min-height:28px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 10px;white-space:nowrap}
.intent b{font-family:"Cinzel",serif;color:#FF8A73}
.token{font-size:66px;line-height:1.1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.enemy.elite .token{font-size:78px}
.enemy.boss .token{font-size:104px}
.ename{font-size:14px}
.enemy.elite .ename,.enemy.boss .ename{color:#F2C46B}
.hpbar{position:relative;width:100%;height:16px;background:rgba(255,255,255,.12);border-radius:8px;overflow:visible}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp);border-radius:8px;transition:width .25s}
.hpbar span{position:relative;display:block;text-align:center;font-size:11px;line-height:16px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.hpbar.shield i{background:#4C8DB0}
.bk{position:absolute;left:-12px;top:-7px;background:#2F6E8C;color:#fff;border-radius:6px;font-style:normal;font-size:12px;font-weight:700;padding:0 5px;line-height:20px;box-shadow:0 0 0 2px var(--arena)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:20px}
.chip{font-size:11px;background:rgba(0,0,0,.4);border-radius:5px;padding:0 5px;line-height:19px}
.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.fx{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:"Cinzel",serif;font-weight:700;font-size:26px;pointer-events:none;white-space:nowrap;animation:floatup .95s ease-out forwards;text-shadow:0 2px 4px #000;z-index:5}
.fx.dmg{color:#FF6B57}
.fx.blk{color:#8FD0F0;font-size:18px;font-family:"Noto Sans SC",sans-serif}
.fx.st{color:#F2C46B;font-size:15px;font-family:"Noto Sans SC",sans-serif}
.fx.heal{color:#8EE07A;font-size:20px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}.fx{animation-duration:.01ms;animation-delay:0s!important;opacity:1}}

.me{display:flex;align-items:center;gap:14px;padding:6px 16px;flex-wrap:wrap;justify-content:center}
.hero{position:relative;display:flex;align-items:center;gap:10px;min-width:240px}
.hero .token{font-size:52px}
.hero .info{flex:1;min-width:150px}
.orb{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE2A3,var(--energy) 55%,#8A4D0D);display:grid;place-items:center;color:#3A1E00;box-shadow:0 0 18px rgba(232,163,58,.55);flex:none}
.orb>div{display:flex;align-items:baseline;gap:1px}
.orb b{font-family:"Cinzel",serif;font-size:26px;line-height:1}
.orb small{font-family:"Cinzel",serif;font-size:13px;opacity:.75}
.orb.empty{filter:grayscale(.8) brightness(.7);box-shadow:none}
.piles{display:flex;gap:10px;font-size:13px;opacity:.8}
.endturn{background:#C9822B;border:0;color:#2A1600;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:15px}
.endturn:disabled{opacity:.4;cursor:wait}
.hand{display:flex;justify-content:center;gap:8px;padding:10px 12px 16px;overflow-x:auto;min-height:182px}
.hand .card{flex:none}

/* card */
.card{position:relative;width:118px;height:166px;border-radius:10px;border:2px solid #5C4A3A;background:var(--parch);color:var(--parch-ink);padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:transform .12s}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;background:var(--tc)}
.card.t-atk{--tc:var(--t-atk)}.card.t-skl{--tc:var(--t-skl)}.card.t-pow{--tc:var(--t-pow)}
.card.r-unc{border-color:#4E7FA0}
.card.r-rare{border-color:#D9A93A;box-shadow:0 0 0 1px #F5D27A,0 4px 12px rgba(217,169,58,.45)}
.card:hover:not(:disabled){transform:translateY(-6px)}
.card .cost{position:absolute;left:4px;top:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE2A3,var(--energy) 60%,#8A4D0D);color:#2A1600;font-family:"Cinzel",serif;font-size:14px;line-height:24px;z-index:1;box-shadow:0 0 0 1.5px #2A1600}
.card .cname{position:relative;z-index:1;color:#fff;font-family:"ZCOOL XiaoWei",serif;font-size:15px;line-height:30px;padding-left:18px;white-space:nowrap}
.card.up .cname{color:#BFF29E}
.card .art{font-size:34px;line-height:1;margin:8px 0 2px}
.card .ctype{font-size:10px;color:#7A6A5A;letter-spacing:.1em}
.card .cdesc{font-size:12px;line-height:1.4;padding:3px 7px 6px;flex:1;display:flex;align-items:center}
.card .cdesc b{color:var(--parch-ink)}
.card .cdesc b.up{color:#2E7D1E}
.card .cdesc b.down{color:#B33A2B}
.card.nope{filter:saturate(.4) brightness(.8)}
.card.nope:hover{transform:none}
.card:disabled{cursor:default}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.panel h2{margin:0 0 6px;font-size:24px}
.cardrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.price{font-family:"Cinzel",serif;color:var(--gold);font-size:15px}
.sold{opacity:.3}
.reward{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);margin:8px 0;width:100%;text-align:left;cursor:pointer}
.reward:disabled{opacity:.4;cursor:default}
.reward .ri{font-size:24px}
.choice{display:block;width:100%;text-align:left;margin:8px 0}
.bigmsg{text-align:center;padding:30px 10px}
.bigmsg .ico{font-size:72px;line-height:1}
.bigmsg h2{font-size:clamp(34px,8vw,52px);margin:10px 0 4px}

/* overlay */
.over{position:fixed;inset:0;background:rgba(10,8,12,.72);z-index:30;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.over .box{max-width:900px;margin:0 auto;background:var(--surface);border-radius:14px;padding:16px}
.over .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:90vw;text-align:center}

@media (max-width:600px){
  .card{width:96px;height:146px}
  .card .cname{font-size:13px}
  .card .art{font-size:28px;margin:6px 0 0}
  .card .cdesc{font-size:11px;padding:2px 5px 5px}
  .enemy{width:118px}
  .token{font-size:52px}.enemy.elite .token{font-size:62px}.enemy.boss .token{font-size:82px}
  .hand{justify-content:flex-start;min-height:160px}
  .hero{min-width:0}
  .hero .token{font-size:40px}
  .floor{grid-template-columns:40px 1fr}
  .node{min-width:0;padding:7px 10px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<div id="toast" class="toast" hidden></div>
<script>
const KEY='abyss-tower-v1',BEST='abyss-tower-best';
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let S=null,C=null,UI={over:null},FX=[],HIT={};

/* ---------- cards ---------- */
function DM(base,mul=1,all=false){
  if(!C)return `<b>${base}</b>`;
  const v=pDmg(base,all?null:curTarget(),mul);
  return `<b class="${v>base?'up':v<base?'down':''}">${v}</b>`;
}
const TYPE={atk:'攻击',skl:'技能',pow:'能力'};
const CARDS={
  strike:{n:'打击',c:1,t:'atk',r:'basic',e:'🗡️',d:u=>`造成 ${DM(u?9:6)} 点伤害`,f:u=>atk(u?9:6)},
  defend:{n:'防御',c:1,t:'skl',r:'basic',e:'🛡️',d:u=>`获得 ${u?8:5} 点格挡`,f:u=>gainBlock(u?8:5)},
  bash:{n:'重击',c:2,t:'atk',r:'basic',e:'🔨',d:u=>`造成 ${DM(u?10:8)} 点伤害，施加 ${u?3:2} 层易伤`,f:u=>{const t=curTarget();hitEnemy(t,u?10:8);if(t.hp>0)applyE(t,'vuln',u?3:2)}},
  twin:{n:'连斩',c:1,t:'atk',r:'com',e:'⚔️',d:u=>`造成 ${DM(u?7:5)} 点伤害 2 次`,f:u=>atk(u?7:5,2)},
  cleave:{n:'横扫',c:1,t:'atk',r:'com',e:'🌀',d:u=>`对所有敌人造成 ${DM(u?11:8,1,true)} 点伤害`,f:u=>atkAll(u?11:8)},
  jab:{n:'快拳',c:0,t:'atk',r:'com',e:'👊',d:u=>`造成 ${DM(u?6:3)} 点伤害，抽 1 张牌`,f:u=>{atk(u?6:3);draw(1)}},
  sunder:{n:'破甲',c:1,t:'atk',r:'com',e:'🔪',d:u=>`造成 ${DM(u?9:7)} 点伤害，施加 ${u?2:1} 层虚弱`,f:u=>{const t=curTarget();hitEnemy(t,u?9:7);if(t.hp>0)applyE(t,'weak',u?2:1)}},
  venom:{n:'毒刃',c:1,t:'atk',r:'com',e:'🐍',d:u=>`造成 ${DM(u?6:4)} 点伤害，施加 ${u?5:3} 层中毒`,f:u=>{const t=curTarget();hitEnemy(t,u?6:4);if(t.hp>0)applyE(t,'poison',u?5:3)}},
  slam:{n:'全身撞击',c:1,cu:0,t:'atk',r:'com',e:'💥',d:u=>`造成等同于你格挡值的伤害（${DM(C?C.p.block:0)}）`,f:u=>atk(C.p.block)},
  anger:{n:'怒火',c:0,t:'atk',r:'com',e:'😤',d:u=>`造成 ${DM(u?8:6)} 点伤害，放一张复制到弃牌堆`,f:u=>{atk(u?8:6);C.discard.push({uid:nid(),id:'anger',up:u})}},
  shrug:{n:'硬抗',c:1,t:'skl',r:'com',e:'🪖',d:u=>`获得 ${u?11:8} 点格挡，抽 1 张牌`,f:u=>{gainBlock(u?11:8);draw(1)}},
  shout:{n:'战吼',c:0,t:'skl',r:'com',e:'📯',ex:1,d:u=>`抽 ${u?3:2} 张牌。消耗`,f:u=>draw(u?3:2)},
  scare:{n:'恐吓',c:0,t:'skl',r:'com',e:'😠',ex:1,d:u=>`所有敌人获得 ${u?2:1} 层虚弱。消耗`,f:u=>alive().forEach(e=>applyE(e,'weak',u?2:1))},
  haze:{n:'毒雾',c:1,t:'skl',r:'com',e:'☁️',d:u=>`所有敌人获得 ${u?6:4} 层中毒`,f:u=>alive().forEach(e=>applyE(e,'poison',u?6:4))},
  heavy:{n:'巨刃',c:2,t:'atk',r:'unc',e:'🪓',d:u=>`造成 ${DM(14,u?5:3)} 点伤害，力量效果 ×${u?5:3}`,f:u=>atk(14,1,u?5:3)},
  rampage:{n:'狂怒',c:1,t:'atk',r:'unc',e:'🔥',d:(u,c)=>`造成 ${DM(8+((c&&c.bonus)||0))} 点伤害，本场每次打出伤害 +${u?8:5}`,f:(u,c)=>{atk(8+(c.bonus||0));c.bonus=(c.bonus||0)+(u?8:5)}},
  entrench:{n:'堡垒',c:2,cu:1,t:'skl',r:'unc',e:'🏰',d:u=>`你的格挡值翻倍`,f:u=>gainBlock(C.p.block)},
  adren:{n:'肾上腺素',c:0,t:'skl',r:'unc',e:'⚡',ex:1,d:u=>`获得 ${u?2:1} 点能量，抽 2 张牌。消耗`,f:u=>{C.energy+=u?2:1;draw(2)}},
  catal:{n:'催化',c:1,t:'skl',r:'unc',e:'🧪',ex:1,d:u=>`目标的中毒层数${u?'变为 3 倍':'翻倍'}。消耗`,f:u=>{const t=curTarget();if(t)applyE(t,'poison',(t.poison||0)*(u?2:1))}},
  shock:{n:'震荡波',c:1,t:'skl',r:'unc',e:'🌊',ex:1,d:u=>`所有敌人获得 ${u?3:2} 层虚弱和易伤。消耗`,f:u=>alive().forEach(e=>{applyE(e,'weak',u?3:2);applyE(e,'vuln',u?3:2)})},
  whirl:{n:'旋风斩',c:2,t:'atk',r:'unc',e:'🌪️',d:u=>`对所有敌人造成 ${DM(u?7:5,1,true)} 点伤害 2 次`,f:u=>atkAll(u?7:5,2)},
  inflame:{n:'燃烧意志',c:1,t:'pow',r:'unc',e:'💪',d:u=>`获得 ${u?3:2} 点力量`,f:u=>{C.p.str+=u?3:2;fx('p',`力量 +${u?3:2}`,'st')}},
  metal:{n:'金属化',c:1,t:'pow',r:'unc',e:'🔩',d:u=>`每回合结束时获得 ${u?4:3} 点格挡`,f:u=>C.p.metal+=u?4:3},
  fumes:{n:'毒气',c:1,t:'pow',r:'unc',e:'☠️',d:u=>`每回合开始时，所有敌人获得 ${u?3:2} 层中毒`,f:u=>C.p.fumes+=u?3:2},
  frenzy:{n:'狂乱',c:2,t:'atk',r:'rare',e:'💫',d:u=>`造成 ${DM(u?5:4)} 点伤害 ${u?5:4} 次`,f:u=>atk(u?5:4,u?5:4)},
  execute:{n:'处决',c:3,t:'atk',r:'rare',e:'🔱',d:u=>`造成 ${DM(u?42:30)} 点伤害`,f:u=>atk(u?42:30)},
  demon:{n:'恶魔形态',c:3,t:'pow',r:'rare',e:'😈',d:u=>`每回合开始时获得 ${u?3:2} 点力量`,f:u=>C.p.demon+=u?3:2},
  barricade:{n:'壁垒',c:3,cu:2,t:'pow',r:'rare',e:'🧱',d:u=>`格挡不再在回合开始时消失`,f:u=>C.p.barricade=1},
  inspire:{n:'灵感',c:1,cu:0,t:'pow',r:'rare',e:'📖',d:u=>`每回合多抽 1 张牌`,f:u=>C.p.inspire+=1},
  offering:{n:'献祭',c:0,t:'skl',r:'rare',e:'🩸',ex:1,d:u=>`失去 6 点生命，获得 2 点能量，抽 ${u?5:3} 张牌。消耗`,f:u=>{loseHp(6);C.energy+=2;draw(u?5:3)}},
  limit:{n:'极限突破',c:1,t:'skl',r:'rare',e:'🌟',ex:u=>!u,d:u=>`力量翻倍。${u?'':'消耗'}`,f:u=>{const g=C.p.str;C.p.str*=2;if(g>0)fx('p',`力量 +${g}`,'st')}}
};
const POOL=r=>Object.keys(CARDS).filter(k=>CARDS[k].r===r);
const costOf=c=>{const d=CARDS[c.id];return c.up&&d.cu!==undefined?d.cu:d.c};
const exOf=c=>{const d=CARDS[c.id];return typeof d.ex==='function'?d.ex(c.up):!!d.ex};
function rollCard(elite){const x=Math.random()*100,w=elite?[45,40]:[60,32];return pick(POOL(x<w[0]?'com':x<w[0]+w[1]?'unc':'rare'))}
function rollCards(n,elite){const s=new Set();let g=0;while(s.size<n&&g++<50)s.add(rollCard(elite));return [...s]}

};
const EASY=[['slime'],['wolf'],['bat','bat'],['shroom','bat']];
const NORMAL=[['cultist'],['slime','slime','bat'],['archer','bat'],['shroom','shroom','bat'],['wolf','slime'],['snake'],['archer','archer'],['wolf','bat','bat']];

function makeEnemy(k){
  const d=EN[k],fl=d.boss?0:S.floor,hm=1+.25*S.loop+.025*fl,dm=1+.2*S.loop+.012*fl,hp=Math.round(R(d.hp[0],d.hp[1])*hm);
  return {uid:nid(),k,name:d.n,hp,max:hp,block:0,str:0,weak:0,vuln:0,poison:0,t:0,dm,bm:hm,next:null};
}

/* ---------- run ---------- */
const nid=()=>S.uid++;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);if(d&&d.v===1)return d}}catch(e){}return null}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function getBest(){try{return JSON.parse(localStorage.getItem(BEST))||null}catch(e){return null}}
function setBest(){const b=getBest(),sc=S.loop*13+S.floor;if(!b||sc>b.sc){try{localStorage.setItem(BEST,JSON.stringify({sc,loop:S.loop,floor:S.floor}))}catch(e){}}}

function genMap(){
  const m=[];
  for(let f=0;f<12;f++){
    if(f===0){m.push(['fight','fight','event']);continue}
    if(f===11){m.push(['rest','shop']);continue}
    const w=[['fight',45],['elite',f>=3?16:0],['rest',f>=4?12:0],['shop',f>=2?12:0],['event',15]],row=[];
    while(row.length<3){let x=Math.random()*w.reduce((s,a)=>s+a[1],0);for(const [k,v] of w){x-=v;if(x<0){row.push(k);break}}}
    if(row.every(r=>r===row[0]))row[2]=row[0]==='fight'?'event':'fight';
    m.push(row);
  }
  m.push(['boss']);
  return m;
}
function newRun(){
  S={v:1,uid:1,hp:80,maxHp:80,gold:99,relics:['blood'],loop:0,floor:0,removeCost:75,path:[],screen:'map'};
  S.deck=[...Array(5).fill('strike'),...Array(4).fill('defend'),'bash'].map(id=>({uid:nid(),id,up:false}));
  S.map=genMap();save();render();
}
const NODE={fight:['⚔️','战斗'],elite:['👹','精英'],rest:['🔥','篝火'],shop:['🛒','商店'],event:['❓','事件'],boss:['🐉','首领']};

function enterNode(i){
  const type=S.map[S.floor][i];S.path[S.floor]=i;
  if(type==='fight'||type==='elite'||type==='boss')startCombat(type);
  else if(type==='rest'){S.screen='rest';S.rest={done:false};save();render()}
  else if(type==='shop'){S.screen='shop';S.shop=genShop();save();render()}
  else{S.screen='event';S.event={k:pick(Object.keys(EVENTS).filter(k=>!EVENTS[k].req||EVENTS[k].req())),res:null};save();render()}
}
function nextFloor(){
  S.floor++;S.screen='map';S.reward=S.shop=S.event=S.rest=null;save();render();window.scrollTo(0,0);
}

/* ---------- combat ---------- */
function startCombat(type){
  let group=type==='boss'?[pick(['dragon','titan'])]:type==='elite'?pick(ELITES):S.floor<=2&&S.loop===0?pick(EASY):pick(NORMAL);
  C={type,enemies:group.map(makeEnemy),draw:shuffle(S.deck.map(c=>({...c}))),hand:[],discard:[],exhaust:[],energy:0,turn:0,
     p:{block:0,str:0,weak:0,vuln:0,poison:0,metal:0,fumes:0,demon:0,barricade:0,inspire:0},atkCount:0,target:null,busy:false};
  C.enemies.forEach(e=>{e.next=EN[e.k].ai(e,0)});
  if(has('whet'))C.p.str+=1;
  if(has('sac'))C.enemies.forEach(e=>e.poison+=3);
  S.screen='combat';FX=[];HIT={};
  startTurn();
}
function alive(){return C.enemies.filter(e=>e.hp>0)}
function curTarget(){let t=C.enemies.find(e=>e.uid===C.target&&e.hp>0);if(!t){t=alive()[0];if(t)C.target=t.uid}return t}
function pDmg(base,e,mul=1){let d=base+C.p.str*mul;if(C.p.weak>0)d*=.75;if(e&&e.vuln>0)d*=1.5;return Math.max(0,Math.floor(d))}
function eDmg(e,a){let d=Math.round(a*e.dm)+e.str;if(e.weak>0)d*=.75;if(C.p.vuln>0)d*=1.5;return Math.max(0,Math.floor(d))}
function hitEnemy(e,base,mul=1){
  if(!e||e.hp<=0)return;
  let d=pDmg(base,e,mul);const b=Math.min(e.block,d);e.block-=b;d-=b;e.hp-=d;
  fx('e'+e.uid,d>0?'-'+d:'格挡',d>0?'dmg':'blk');HIT['e'+e.uid]=performance.now();
  if(e.hp<=0){e.hp=0;if(has('fang'))heal(4)}
}
function atk(base,n=1,mul=1){for(let i=0;i<n;i++){const t=curTarget();if(!t)break;hitEnemy(t,base,mul)}}
function atkAll(base,n=1){for(let i=0;i<n;i++)alive().forEach(e=>hitEnemy(e,base))}
function gainBlock(n){if(n<=0)return;C.p.block+=n;fx('p','+'+n+' 格挡','blk')}
const LBL={weak:'虚弱',vuln:'易伤',poison:'中毒',str:'力量'};
function applyE(e,k,n){if(!e||n<=0)return;e[k]=(e[k]||0)+n;fx('e'+e.uid,`${LBL[k]} +${n}`,'st')}
function draw(n){for(let i=0;i<n;i++){if(C.hand.length>=10)break;if(!C.draw.length){if(!C.discard.length)break;C.draw=shuffle(C.discard);C.discard=[]}C.hand.push(C.draw.pop())}}
function heal(n){const h=Math.min(n,S.maxHp-S.hp);if(h>0){S.hp+=h;if(C)fx('p','+'+h,'heal')}}
function loseHp(n){S.hp-=n;if(C){fx('p','-'+n,'dmg');HIT.p=performance.now()}}
function hitPlayer(d){const b=Math.min(C.p.block,d);C.p.block-=b;d-=b;S.hp-=d;fx('p',d>0?'-'+d:'格挡',d>0?'dmg':'blk');HIT.p=performance.now()}

function startTurn(){
  C.turn++;C.atkCount=0;
  if(!C.p.barricade)C.p.block=0;
  if(C.p.poison>0){loseHp(C.p.poison);C.p.poison--;if(S.hp<=0)return die()}
  C.energy=3+(has('core')?1:0)+(C.turn===1&&has('lantern')?1:0);
  if(C.turn===1&&has('anchor'))gainBlock(10);
  if(C.p.demon){C.p.str+=C.p.demon;fx('p',`力量 +${C.p.demon}`,'st')}
  if(C.p.fumes)alive().forEach(e=>e.poison+=C.p.fumes);
  draw(5+C.p.inspire+(has('crown')?1:0)+(C.turn===1&&has('ring')?2:0));
  C.busy=false;render();
}
function playCard(uid){
  if(!C||C.busy)return;
  const i=C.hand.findIndex(c=>c.uid===uid);if(i<0)return;
  const c=C.hand[i],d=CARDS[c.id],cost=costOf(c);
  if(cost>C.energy){toast('能量不足');return}
  if(d.t==='atk'&&!curTarget())return;
  C.energy-=cost;C.hand.splice(i,1);
  d.f(c.up,c);
  if(d.t==='atk'){C.atkCount++;if(C.atkCount===3&&has('drum')){C.p.str++;fx('p','力量 +1','st')}}
  if(d.t!=='pow'){if(exOf(c))C.exhaust.push(c);else C.discard.push(c)}
  if(S.hp<=0)return die();
  render();checkWin();
}
function checkWin(){
  if(alive().length)return;
  C.busy=true;
  setTimeout(()=>{
    if(has('blood'))heal(8);
    const elite=C.type==='elite',boss=C.type==='boss';
    let gold=boss?R(95,110):elite?R(30,40):R(14,24);if(has('purse'))gold=Math.round(gold*1.5);
    S.reward={gold,goldTaken:false,cards:rollCards(3,elite||boss),cardTaken:false,
      relic:elite?pick(freeRelics(false))||null:null,relicTaken:false,
      boss:boss?shuffle(freeRelics(true)).slice(0,3):null,bossTaken:false};
    C=null;S.screen='reward';save();render();window.scrollTo(0,0);
  },650);
}
async function endTurn(){
  if(!C||C.busy)return;
  C.busy=true;
  C.discard.push(...C.hand);C.hand=[];
  if(C.p.metal)gainBlock(C.p.metal);
  if(has('ori')&&C.p.block===0)gainBlock(6);
  render();
  for(const e of C.enemies){
    if(e.hp<=0)continue;
    await sleep(430);if(!C)return;
    e.block=0;
    if(e.poison>0){e.hp-=e.poison;fx('e'+e.uid,'-'+e.poison,'dmg');HIT['e'+e.uid]=performance.now();e.poison--;
      if(e.hp<=0){e.hp=0;if(has('fang'))heal(4);render();continue}}
    const m=e.next;
    if(m.b){e.block+=Math.round(m.b*e.bm);fx('e'+e.uid,'+格挡','blk')}
    if(m.s){e.str+=m.s;fx('e'+e.uid,`力量 +${m.s}`,'st')}
    if(m.a){for(let i=0;i<(m.n||1);i++)hitPlayer(eDmg(e,m.a))}
    if(m.w)C.p.weak+=m.w;if(m.vu)C.p.vuln+=m.vu;if(m.po)C.p.poison+=m.po;
    if(m.w||m.vu||m.po)fx('p',[m.w&&'虚弱',m.vu&&'易伤',m.po&&'中毒'].filter(Boolean).join(' '),'st');
    e.t++;e.next=EN[e.k].ai(e,e.t);
    if(e.weak>0)e.weak--;if(e.vuln>0)e.vuln--;
    render();
    if(S.hp<=0)return die();
  }
  if(!alive().length){render();checkWin();return}
  if(C.p.weak>0)C.p.weak--;if(C.p.vuln>0)C.p.vuln--;
  await sleep(300);if(!C)return;
  startTurn();
}
function die(){S.hp=0;C&&(C.busy=true);setBest();setTimeout(()=>{C=null;S.screen='dead';clearSave();render();window.scrollTo(0,0)},700)}

}

  spring:{e:'⛲',n:'治愈之泉',t:'清澈的泉水闪着微光。',

  gambler:{e:'🎲',n:'地下赌徒',t:'「敢不敢赌一把？赢了翻倍，输了归我。」',req:()=>S.gold>=50,
    opts:()=>[['赌 50 金币','a'],['不赌','x']],
    run:o=>{if(o==='a'){if(Math.random()<.5){S.gold+=50;return '你赢了！金币 +50。'}S.gold-=50;return '你输了 50 金币。赌徒笑着走开了。'}return '你摇摇头离开了。'}}
};
function addCard(id,up=false){S.deck.push({uid:nid(),id,up})}

/* ---------- FX ---------- */
function fx(target,text,cls){FX.push({id:Math.random(),t:performance.now(),target,text,cls});clearTimeout(fx.c);fx.c=setTimeout(()=>{const n=performance.now();FX=FX.filter(f=>n-f.t<950);if(S&&S.screen==='combat')render()},1000)}
function fxHtml(target){const n=performance.now();return FX.filter(f=>f.target===target&&n-f.t<950).map((f,i)=>`<span class="fx ${f.cls}" style="animation-delay:-${Math.round(n-f.t)}ms;margin-top:${-i*22}px">${f.text}</span>`).join('')}
function hitCls(target){const t=HIT[target];if(!t)return '';const d=performance.now()-t;return d<350?`hit" style="animation-delay:-${Math.round(d)}ms`:''}

}
function topbar(){

  <p class="sub">用一副牌爬上 13 层，打倒塔顶的首领。<br>打赢之后，塔会变得更高、更危险。</p>
  <div class="row">${sv?`<button class="btn primary" data-act="cont">继续冒险（第 ${sv.loop+1} 轮第 ${Math.min(sv.floor+1,13)} 层）</button><button class="btn" data-act="new">重新开始</button>`:`<button class="btn primary" data-act="new">开始冒险</button>`}</div>
  ${b?`<p class="muted" style="margin-top:22px;font-size:14px">最佳纪录：第 ${b.loop+1} 轮第 ${Math.min(b.floor+1,13)} 层</p>`:''}
  <p class="muted" style="font-size:13px;max-width:420px;margin:18px auto 0">玩法：点卡牌出牌，点敌人切换目标。敌人头顶的图标会告诉你它下一步要做什么。</p></div></div>`;
}
function vMap(){
  return `<div class="wrap"><h2 class="disp" style="text-align:center;font-size:28px;margin:4px 0">选择下一站</h2>
  <p class="muted" style="text-align:center;margin:0 0 6px;font-size:14px">塔顶的首领在等着你。往上走，每层只能选一个。</p>
  <div class="mapgrid">${S.map.map((row,f)=>{
    const cls=f<S.floor?'done':f===S.floor?'now':'';
    return `<div class="floor ${cls}"><span class="fl">${f+1}F</span><div class="nodes">${row.map((t,i)=>{
      const tag=f===S.floor?`button data-act="go" data-arg="${i}"`:'div';
      return `<${tag} class="node ${f<S.floor&&S.path[f]===i?'took':''}"><span class="ni">${NODE[t][0]}</span>${NODE[t][1]}</${tag.split(' ')[0]}>`}).join('')}</div></div>`}).join('')}
  </div></div>`;
}
function intentHtml(e){
  const m=e.next,p=[],tip=[];
  if(m.a){p.push(`⚔️ <b>${eDmg(e,m.a)}</b>${m.n>1?'×'+m.n:''}`);tip.push('攻击')}
  if(m.b){p.push('🛡️');tip.push('防御')}
  if(m.s){p.push('💪');tip.push('增强力量')}
  if(m.w||m.vu){p.push('🌀');tip.push('施加负面状态')}
  if(m.po){p.push('☠️');tip.push('施加中毒')}
  return `<div class="intent" title="下回合：${tip.join('、')}">${p.join(' ')}</div>`;
}
function chips(o){
  const a=[];if(o.str)a.push(`💪${o.str}`);if(o.weak)a.push(`虚弱 ${o.weak}`);if(o.vuln)a.push(`易伤 ${o.vuln}`);if(o.poison)a.push(`☠️${o.poison}`);
  if(o.metal)a.push(`金属化 ${o.metal}`);if(o.demon)a.push(`恶魔 ${o.demon}`);if(o.fumes)a.push(`毒气 ${o.fumes}`);if(o.barricade)a.push('壁垒');if(o.inspire)a.push(`灵感 ${o.inspire}`);
  return `<div class="chips">${a.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
}
function vCombat(){
  if(!C)return '';
  const tgt=curTarget();
  const foes=C.enemies.filter(e=>e.hp>0).map(e=>{const d=EN[e.k];return `<button class="enemy ${d.elite?'elite':''} ${d.boss?'boss':''} ${tgt&&tgt.uid===e.uid&&alive().length>1?'tgt':''} ${hitCls('e'+e.uid)}" data-act="target" data-arg="${e.uid}" aria-label="${e.name}，生命 ${e.hp}">
    ${intentHtml(e)}<div class="token">${d.e}</div><div class="ename disp">${e.name}</div>
    <div class="hpbar ${e.block?'shield':''}"><i style="width:${e.hp/e.max*100}%"></i><span>${e.hp}/${e.max}</span>${e.block?`<em class="bk">🛡${e.block}</em>`:''}</div>
    ${chips(e)}${fxHtml('e'+e.uid)}</button>`}).join('');
  const maxE=3+(has('core')?1:0);
  return `<main class="arena"><div class="foes">${foes}</div>
  <div class="me">
   <div class="hero ${hitCls('p')}"><div class="token">🧝</div><div class="info">
    <div class="hpbar ${C.p.block?'shield':''}"><i style="width:${S.hp/S.maxHp*100}%"></i><span>${S.hp}/${S.maxHp}</span>${C.p.block?`<em class="bk">🛡${C.p.block}</em>`:''}</div>
    ${chips(C.p)}</div>${fxHtml('p')}</div>
   <div class="orb ${C.energy?'':'empty'}"><div><b>${C.energy}</b><small>/${maxE}</small></div></div>
   <div class="piles"><span>抽牌 ${C.draw.length}</span><span>弃牌 ${C.discard.length}</span>${C.exhaust.length?`<span>消耗 ${C.exhaust.length}</span>`:''}</div>
   <button class="endturn" data-act="end" ${C.busy?'disabled':''}>${C.busy?'敌人行动中…':'结束回合'}</button>
  </div>
  <div class="hand">${C.hand.map(c=>cardHtml(c,{act:'play',cls:costOf(c)>C.energy||C.busy?'nope':''})).join('')||'<p style="opacity:.6;align-self:center">手牌已用完</p>'}</div></main>`;
}
function vReward(){
  const r=S.reward,boss=!!r.boss;
  return `<div class="wrap"><section class="panel"><h2 class="disp">${boss?'首领倒下了！':'战斗胜利'}</h2>
  <button class="reward" data-act="rgold" ${r.goldTaken?'disabled':''}><span class="ri">💰</span>${r.goldTaken?'已拿取':''} ${r.gold} 金币</button>
  ${r.relic?`<button class="reward" data-act="rrelic" ${r.relicTaken?'disabled':''}><span class="ri">${RELICS[r.relic].e}</span><span><b>${RELICS[r.relic].n}</b><br><span class="muted" style="font-size:13px">${RELICS[r.relic].d}</span></span></button>`:''}
  ${boss?`<h3 class="disp" style="font-size:20px;margin:16px 0 4px">选一件首领遗物</h3>${r.bossTaken?'<p class="muted">已选择。</p>':r.boss.map(k=>`<button class="reward" data-act="rboss" data-arg="${k}"><span class="ri">${RELICS[k].e}</span><span><b>${RELICS[k].n}</b><br><span class="muted" style="font-size:13px">${RELICS[k].d}</span></span></button>`).join('')}`:''}
  <h3 class="disp" style="font-size:20px;margin:16px 0 0">选一张牌加入牌组</h3>
  ${r.cardTaken?'<p class="muted">已选择。</p>':`<div class="cardrow">${r.cards.map(id=>cardHtml({id,up:false},{act:'rcard',arg:id})).join('')}</div>`}
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
  <button class="btn primary" data-act="${boss?'nextloop':'next'}">${boss?`登上第 ${S.loop+2} 轮的塔`:r.cardTaken?'继续前进':'跳过，继续前进'}</button></div>
  ${boss?'<p class="muted" style="font-size:13px;text-align:right;margin:8px 0 0">下一轮敌人会更强，但你的牌组和遗物都会保留，生命也会回满。</p>':''}
  </section></div>`;
}
function vShop(){
  const s=S.shop;
  return `<div class="wrap"><section class="panel"><h2 class="disp">🛒 地下商店</h2><p class="muted" style="margin:0">「随便看看，金币说话。」</p>
  <div class="cardrow">${s.cards.map((x,i)=>`<div class="shopitem ${x.sold?'sold':''}">${cardHtml({id:x.id,up:false},{act:x.sold?'':'buy',arg:i,dis:x.sold})}<span class="price">${x.sold?'已售出':'💰 '+x.price}</span></div>`).join('')}</div>
  ${s.relic?`<button class="reward" data-act="buyrelic" ${s.relic.sold||S.gold<s.relic.price?'disabled':''}><span class="ri">${RELICS[s.relic.k].e}</span><span style="flex:1"><b>${RELICS[s.relic.k].n}</b><br><span class="muted" style="font-size:13px">${RELICS[s.relic.k].d}</span></span><span class="price">${s.relic.sold?'已售出':'💰 '+s.relic.price}</span></button>`:''}
  <button class="reward" data-act="shopremove" ${s.removed||S.gold<S.removeCost?'disabled':''}><span class="ri">🗑️</span><span style="flex:1"><b>删牌服务</b><br><span class="muted" style="font-size:13px">从牌组里永久移除一张牌，让好牌更容易抽到</span></span><span class="price">${s.removed?'已使用':'💰 '+S.removeCost}</span></button>
  <div style="text-align:right;margin-top:12px"><button class="btn primary" data-act="next">离开商店</button></div></section></div>`;
}
function vRest(){
  const r=S.rest,h=Math.round(S.maxHp*.3);
  return `<div class="wrap"><section class="panel"><h2 class="disp">🔥 篝火</h2><p class="muted" style="margin:0 0 10px">火光让人安心。你只有时间做一件事。</p>
  ${r.done?`<p>${r.msg}</p><div style="text-align:right"><button class="btn primary" data-act="next">继续前进</button></div>`:
  `<button class="reward" data-act="rheal"><span class="ri">💤</span><span><b>休息</b><br><span class="muted" style="font-size:13px">回复 ${h} 点生命（现在 ${S.hp}/${S.maxHp}）</span></span></button>
   <button class="reward" data-act="rup" ${S.deck.some(c=>!c.up)?'':'disabled'}><span class="ri">⚒️</span><span><b>锻造</b><br><span class="muted" style="font-size:13px">升级一张牌，让它变得更强</span></span></button>`}</section></div>`;
}
function vEvent(){
  const ev=EVENTS[S.event.k];
  return `<div class="wrap"><section class="panel"><div style="font-size:56px;line-height:1">${ev.e}</div><h2 class="disp">${ev.n}</h2><p>${ev.t}</p>
  ${S.event.res!=null?`<p><b>${S.event.res}</b></p><div style="text-align:right"><button class="btn primary" data-act="next">继续前进</button></div>`:
  ev.opts().map(([l,o])=>`<button class="btn choice" data-act="ev" data-arg="${o}">${l}</button>`).join('')}</section></div>`;
}
function vDead(){
  return `<div class="wrap"><div class="bigmsg"><div class="ico">🪦</div><h2 class="disp">冒险结束</h2>
  <p>你倒在了第 ${S.loop+1} 轮的第 ${S.floor+1} 层。</p>
  <p class="muted" style="font-size:14px">牌组 ${S.deck.length} 张，遗物 ${S.relics.length} 件。</p>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn primary" data-act="new">再来一次</button><button class="btn" data-act="home">回到标题</button></div></div>
  <section class="panel"><h3 class="disp" style="margin:0 0 6px;font-size:20px">你最后的牌组</h3><div class="cardrow">${sortDeck(S.deck).map(c=>cardHtml(c,{dis:1})).join('')}</div></section></div>`;
}
const sortDeck=d=>[...d].sort((a,b)=>({pow:0,atk:1,skl:2})[CARDS[a.id].t]-({pow:0,atk:1,skl:2})[CARDS[b.id].t]||a.id.localeCompare(b.id));
function renderOver(){
  const el=document.getElementById('ov'),o=UI.over;
  if(!o||!S){el.innerHTML='';return}
  const title={deck:'你的牌组',upgrade:'选一张牌升级',remove:'选一张牌删除'}[o.mode];
  const list=sortDeck(S.deck).filter(c=>o.mode!=='upgrade'||!c.up);
  const can=o.mode==='deck'||o.from!=='event';
  el.innerHTML=`<div class="over" role="dialog" aria-label="${title}"><div class="box"><div class="head"><h2 class="disp" style="margin:0">${title}</h2>
  ${can?`<button class="btn sm" data-act="close">${o.mode==='deck'?'关闭':'取消'}</button>`:''}</div>
  ${o.mode==='upgrade'?'<p class="muted" style="margin:0;font-size:14px">升级后名字会变绿，数值更高，部分牌费用会降低。</p>':''}
  <div class="cardrow">${list.map(c=>cardHtml(o.mode==='upgrade'?{...c,up:true}:c,{act:o.mode==='deck'?'':'pick',arg:c.uid,dis:o.mode==='deck'})).join('')}</div></div></div>`;
}

/* ---------- actions ---------- */
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
const A={
  new:()=>{UI.over=null;newRun()},
  cont:()=>{S=load();if(S.screen==='combat')S.screen='map';render()},
  home:()=>{S=null;render()},
  go:i=>enterNode(+i),
  deck:()=>{UI.over={mode:'deck'};renderOver()},
  close:()=>{UI.over=null;renderOver()},
  relic:k=>toast(`${RELICS[k].n}：${RELICS[k].d}`),
  target:u=>{if(C){C.target=+u;render()}},
  play:u=>playCard(+u),
  end:()=>endTurn(),
  rgold:()=>{const r=S.reward;if(r.goldTaken)return;r.goldTaken=true;S.gold+=r.gold;save();render()},
  rrelic:()=>{const r=S.reward;if(r.relicTaken)return;r.relicTaken=true;gainRelic(r.relic);toast(`获得「${RELICS[r.relic].n}」`);save();render()},
  rboss:k=>{const r=S.reward;if(r.bossTaken)return;r.bossTaken=true;gainRelic(k);toast(`获得「${RELICS[k].n}」`);save();render()},
  rcard:id=>{const r=S.reward;if(r.cardTaken)return;r.cardTaken=true;addCard(id);toast(`「${CARDS[id].n}」加入了牌组`);save();render()},
  next:()=>{const r=S.reward;if(r&&!r.goldTaken){S.gold+=r.gold}nextFloor()},
  nextloop:()=>{const r=S.reward;if(!r.goldTaken)S.gold+=r.gold;S.loop++;S.floor=-1;S.path=[];S.map=genMap();S.hp=S.maxHp;setBest();nextFloor()},
  buy:i=>{const x=S.shop.cards[+i];if(!x||x.sold)return;if(S.gold<x.price){toast('金币不够');return}S.gold-=x.price;x.sold=true;addCard(x.id);toast(`买下「${CARDS[x.id].n}」`);save();render()},
  buyrelic:()=>{const x=S.shop.relic;if(!x||x.sold||S.gold<x.price)return;S.gold-=x.price;x.sold=true;gainRelic(x.k);toast(`获得「${RELICS[x.k].n}」`);save();render()},
  shopremove:()=>{if(S.shop.removed||S.gold<S.removeCost)return;UI.over={mode:'remove',from:'shop'};renderOver()},
  rheal:()=>{const h=Math.round(S.maxHp*.3);heal(h);S.rest={done:true,msg:`你睡了一觉，回复了生命，现在 ${S.hp}/${S.maxHp}。`};save();render()},
  rup:()=>{UI.over={mode:'upgrade',from:'rest'};renderOver()},
  ev:o=>{const res=EVENTS[S.event.k].run(o);if(res===false){toast('金币不够');return}if(res!==null)S.event.res=res;save();render()},
  pick:u=>{
    const o=UI.over,c=S.deck.find(x=>x.uid===+u);if(!c)return;
    if(o.mode==='upgrade'){c.up=true;S.rest={done:true,msg:`「${CARDS[c.id].n}」升级成了「${CARDS[c.id].n}+」。`}}
    else if(o.mode==='remove'){
      if(S.deck.length<=5){toast('牌组至少要留 5 张');return}
      S.deck=S.deck.filter(x=>x!==c);
      if(o.from==='shop'){S.gold-=S.removeCost;S.removeCost+=25;S.shop.removed=true}
      else S.event.res=`你洗去了「${CARDS[c.id].n}${c.up?'+':''}」，感觉轻松了许多。`;
      toast(`删除了「${CARDS[c.id].n}」`);
    }
    UI.over=null;save();render();
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset.arg)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.over&&(UI.over.mode==='deck'||UI.over.from!=='event')){UI.over=null;renderOver()}
  if(S&&S.screen==='combat'&&C&&!UI.over){
    if(e.key==='e'||e.key==='E')endTurn();
    const n=parseInt(e.key,10);if(n>=1&&n<=9&&C.hand[n-1])playCard(C.hand[n-1].uid);
  }
});
render();
</script>
</body>
</html>
